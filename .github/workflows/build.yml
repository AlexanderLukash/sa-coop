# Builds SA:COOP on every push and pull request and keeps the archive as an artifact.
# A tag like v0.2.0 also publishes the archive as a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the compiler
        uses: actions/cache@v4
        with:
          path: toolchain/llvm-mingw
          key: llvm-mingw-20261006-ucrt-x86_64

      - name: Get the compiler
        shell: pwsh
        run: ./tools/get-toolchain.ps1

      - name: Check the layers (Feature-Sliced Design)
        run: python tools/fsd_check.py

      - name: Build the archive
        run: python tools/build.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: SA-COOP
          path: dist/SA-COOP.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SA:COOP ${{ github.ref_name }}
          files: dist/SA-COOP.zip
          body: |
            Мод для GTA San Andreas 1.0 US, с которым сюжет можно пройти вдвоём по сети.

            Распакуйте `SA-COOP.zip` в папку игры, чтобы `coop.asi`, `install.bat` и папка `coop` оказались рядом
            с `gta_sa.exe`, и запустите `install.bat`. Подробная инструкция лежит в архиве в файле `Инструкция.txt`,
            а описание мода в README репозитория.

            Хосту и напарнику нужна одна и та же версия мода.
